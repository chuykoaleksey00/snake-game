[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-game"
description = "Classic snake game built on pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.6"]

[project.scripts]
snake-game = "snake_game.app:main"

[tool.setuptools]
packages = ["snake_game"]

[tool.setuptools.dynamic]
version = { attr = "snake_game.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["snake_game"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["snake_game", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["snake_game"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true
