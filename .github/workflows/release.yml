name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller snake-game.spec --noconfirm --clean

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\snake-game.exe" -ArgumentList "--version" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "snake-game.exe exited with $($process.ExitCode)"
          }

      - name: Attach exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag ".\dist\snake-game.exe" --clobber
